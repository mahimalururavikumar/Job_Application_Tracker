version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: job_tracker_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: job_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: tracker_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_tracker_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=production_secret_key_change_in_real_env_987654
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=mysql+pymysql://tracker_user:tracker_password@db:3306/job_tracker
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      db:
        condition: service_healthy

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_tracker_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
